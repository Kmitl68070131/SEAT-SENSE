<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Desk Booking & Monitoring System</title>
    <!-- Paho MQTT WebSocket Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1d2a44;
            --paper: #e3eefa;
            --grid: #c9dcef;
            --mint: #bdecc9;
            --sun: #ffe38a;
            --coral: #ffb9aa;
            --fog: #dfe3ea;
            --white: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
            margin: 0; padding: 28px 16px 48px; min-height: 100vh;
            color: var(--ink);
            background-color: var(--paper);
            background-image:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 28px 28px;
        }
        h1 {
            font-family: 'Mali', 'Sarabun', sans-serif; font-weight: 700;
            text-align: center; font-size: clamp(24px, 5vw, 36px);
            margin: 0 0 40px;
        }
        .container { display: flex; justify-content: center; gap: 34px; flex-wrap: wrap; }

        .card {
            position: relative; width: 330px; padding: 24px 20px 20px;
            background: var(--mint); border: 3px solid var(--ink); border-radius: 22px;
            box-shadow: 7px 7px 0 var(--ink); transition: background-color 0.3s ease;
        }
        .card:nth-child(odd)  { transform: rotate(-1.2deg); }
        .card:nth-child(even) { transform: rotate(1deg); }
        .card::before {
            content: ""; position: absolute; top: -14px; left: 50%;
            width: 90px; height: 26px; transform: translateX(-50%) rotate(-3deg);
            background: rgba(255,255,255,0.75); border: 2px solid var(--ink); border-radius: 4px;
        }
        /* สีการ์ดตามสถานะ (ไม่ต้องแก้ JS) */
        .card:has(.status-box.booked)   { background: var(--sun); }
        .card:has(.status-box.occupied) { background: var(--coral); }
        .card:has(.status-box.off)      { background: var(--fog); }
        .card.offline-card { background: var(--fog); opacity: 0.8; }

        .card h2 {
            font-family: 'Mali', 'Sarabun', sans-serif; font-size: 22px;
            margin: 6px 0 14px; display: flex; justify-content: space-between;
            align-items: center; gap: 8px;
        }
        .online-tag {
            font-family: 'Sarabun', sans-serif; font-size: 13px; font-weight: 700;
            padding: 2px 10px; border-radius: 999px;
            background: var(--white); border: 2px solid var(--ink); color: var(--ink);
        }
        .online-tag.online::before  { content: "🟢 "; }
        .online-tag.offline::before { content: "⚪ "; }

        .status-box {
            font-weight: 700; padding: 10px; border-radius: 16px; text-align: center;
            margin: 12px 0; font-size: 19px;
            background: var(--white); border: 2.5px solid var(--ink); color: var(--ink);
        }
        .status-box::before { margin-right: 6px; font-size: 24px; vertical-align: -2px; }
        .status-box.vacant::before   { content: "✨"; }
        .status-box.booked::before   { content: "🔑"; }
        .status-box.occupied::before { content: "🔒"; }
        .status-box.off::before      { content: "😴"; }

        .info-group { margin: 8px 2px; font-size: 16px; }
        .info-group:has(#temp-table)::before { content: ""; }
        .pin-box {
            font-family: 'Mali', sans-serif; font-size: 28px; font-weight: 700;
            color: var(--ink); text-align: center; background: var(--white);
            padding: 8px; border: 2.5px dashed var(--ink); border-radius: 14px;
            margin: 10px 0 14px; letter-spacing: 6px;
        }

        .btn {
            width: 100%; padding: 11px; margin-top: 10px; font-size: 17px; font-weight: 700;
            font-family: 'Sarabun', sans-serif; color: var(--ink); background: var(--white);
            border: 2.5px solid var(--ink); border-radius: 14px; cursor: pointer;
            box-shadow: 3px 3px 0 var(--ink); transition: transform 0.08s, box-shadow 0.08s;
        }
        .btn:hover:not(:disabled) { background: #fffbe8; }
        .btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
        .btn:focus-visible { outline: 3px solid #2f6fed; outline-offset: 2px; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

        @media (prefers-reduced-motion: reduce) { .btn, .card { transition: none; } }
        @media (max-width: 400px) { .card { width: 100%; } }
    </style>
</head>
<body>

    <h1>🪑 ระบบจองโต๊ะทำงานอัจฉริยะ ☕<br>(Smart Desk Dashboard)</h1>
    
    <div class="container" id="desk-container"></div>

    <script>
        const broker = "broker.hivemq.com";
        const port = 8884;
        const clientID = "web_client_" + Math.random().toString(16).substr(2, 8);

        const boardsData = {};

        const client = new Paho.MQTT.Client(broker, port, clientID);

        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;

        client.connect({ 
            onSuccess: onConnect,
            onFailure: onConnectFailure,
            useSSL: true 
        });

        function onConnect() {
            console.log("MQTT Connected successfully via SSL!");
            client.subscribe("smartdesk/+/status");
            client.subscribe("smartdesk/+/temp");
            client.subscribe("smartdesk/+/pin");
            client.subscribe("smartdesk/+/online");
        }

        function onConnectFailure(responseObject) {
            console.error("MQTT Connection Failed: " + responseObject.errorMessage);
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.log("Connection Lost: " + responseObject.errorMessage);
            }
        }

        // ตัวช่วยบันทึก/เช็กว่าเครื่องนี้เป็นคนกดจองโต๊ะนี้หรือไม่
        function setMyBooking(boardId, isBooked) {
            if (isBooked) {
                sessionStorage.setItem(`booked_${boardId}`, 'true');
            } else {
                sessionStorage.removeItem(`booked_${boardId}`);
            }
        }

        function isMyBooking(boardId) {
            return sessionStorage.getItem(`booked_${boardId}`) === 'true';
        }

        function getOrCreateCard(boardId) {
            let card = document.getElementById(`desk-${boardId}`);
            if (!card) {
                const container = document.getElementById('desk-container');
                card = document.createElement('div');
                card.className = 'card offline-card';
                card.id = `desk-${boardId}`;
                
                const tableDisplayName = boardId.toUpperCase();
                card.innerHTML = `
                    <h2>
                        <span>🪑 โต๊ะ ${tableDisplayName}</span>
                        <span id="online-${boardId}" class="online-tag offline">OFFLINE</span>
                    </h2>
                    <div>สถานะโต๊ะ: <div id="status-${boardId}" class="status-box off">ไม่พร้อมใช้งาน</div></div>
                    <div class="info-group">🌡️ อุณหภูมิห้อง: <b id="temp-${boardId}">--</b> °C</div>
                    <div class="info-group">🎟️ หมายเลขการจอง (PIN):</div>
                    <div id="pin-${boardId}" class="pin-box">----</div>
                    
                    <button id="btn-book-${boardId}" class="btn btn-book" onclick="sendBooking('${boardId}')" disabled>📌 จองโต๊ะ</button>
                    <button id="btn-logout-${boardId}" class="btn btn-logout" onclick="sendLogout('${boardId}')" disabled>👋 ลอคเอาท์ (คืนโต๊ะ)</button>
                `;
                container.appendChild(card);
            }
            return card;
        }

        function updateBoardUI(boardId) {
            const data = boardsData[boardId];
            if (!data) return;

            const onlineTag = document.getElementById(`online-${boardId}`);
            const statusElem = document.getElementById(`status-${boardId}`);
            const tempElem = document.getElementById(`temp-${boardId}`);
            const pinElem = document.getElementById(`pin-${boardId}`);
            const bookBtn = document.getElementById(`btn-book-${boardId}`);
            const logoutBtn = document.getElementById(`btn-logout-${boardId}`);
            const cardElem = document.getElementById(`desk-${boardId}`);

            if (!data.online) {
                onlineTag.innerText = "OFFLINE";
                onlineTag.className = "online-tag offline";
                cardElem.classList.add("offline-card");

                statusElem.innerText = "ออฟไลน์";
                statusElem.className = "status-box off";
                bookBtn.disabled = true;
                logoutBtn.disabled = true;
                pinElem.innerText = "----";
            } else {
                onlineTag.innerText = "ONLINE";
                onlineTag.className = "online-tag online";
                cardElem.classList.remove("offline-card");

                if (data.status === "VACANT") {
                    statusElem.innerText = "พร้อมใช้งาน";
                    statusElem.className = "status-box vacant";
                    bookBtn.disabled = false;
                    logoutBtn.disabled = true;
                    pinElem.innerText = "----";
                } else if (data.status === "OFF") {
                    statusElem.innerText = "ปิดเครื่อง (OFF)";
                    statusElem.className = "status-box off";
                    bookBtn.disabled = true;
                    logoutBtn.disabled = true;
                    pinElem.innerText = "----";
                } else {
                    // สถานะมีการจองหรือใช้งานอยู่ (BOOKED / OCCUPIED)
                    statusElem.innerText = data.status;
                    statusElem.className = "status-box " + data.status.toLowerCase();
                    bookBtn.disabled = true;
                    
                    // แสดง PIN เฉพาะเครื่องที่กดจองเท่านั้น
                    if (isMyBooking(boardId)) {
                        pinElem.innerText = data.pin;
                        logoutBtn.disabled = false;
                    } else {
                        pinElem.innerText = "****"; // เครื่องอื่นเห็นเป็น ****
                        logoutBtn.disabled = true; // ปิดปุ่มลอคเอาท์สำหรับเครื่องอื่น
                    }
                }
            }
            if (tempElem) tempElem.innerText = data.temp;
        }

        function onMessageArrived(message) {
            const topic = message.destinationName;
            const payload = message.payloadString;
            const topicParts = topic.split("/");
            
            if (topicParts.length < 3 || topicParts[0] !== "smartdesk") return;

            const boardId = topicParts[1];
            const type = topicParts[2];

            if (!boardsData[boardId]) {
                boardsData[boardId] = { online: false, hasBeenOnline: false, status: "VACANT", temp: "--", pin: "----" };
            }

            if (type === "online") {
                const isOnline = (payload === "ONLINE");
                boardsData[boardId].online = isOnline;
                if (isOnline) {
                    boardsData[boardId].hasBeenOnline = true; // ทำเครื่องหมายว่าเคยออนไลน์แล้ว
                }
            } 
            else if (type === "status") {
                boardsData[boardId].status = payload;
                if (payload === "VACANT" || payload === "OFF") {
                    boardsData[boardId].pin = "----";
                    setMyBooking(boardId, false); // ล้างสิทธิ์การจองเมื่อโต๊ะว่าง
                }
            } 
            else if (type === "temp") {
                boardsData[boardId].temp = payload;
            } 
            else if (type === "pin") {
                boardsData[boardId].pin = payload;
            }

            // จะสร้างและแสดงผลการ์ดเฉพาะโต๊ะที่เคยออนไลน์มาแล้วเท่านั้น
            if (boardsData[boardId].hasBeenOnline) {
                getOrCreateCard(boardId);
                updateBoardUI(boardId);
            }
        }

        function sendBooking(boardId) {
            setMyBooking(boardId, true); // บันทึกว่าเครื่องนี้เป็นผู้กดจอง
            const message = new Paho.MQTT.Message("BOOK");
            message.destinationName = `smartdesk/${boardId}/command`;
            client.send(message);
        }

        function sendLogout(boardId) {
            setMyBooking(boardId, false); // ล้างสิทธิ์เมื่อคืนโต๊ะ
            const message = new Paho.MQTT.Message("LOGOUT");
            message.destinationName = `smartdesk/${boardId}/command`;
            client.send(message);
        }
    </script>
</body>
</html>
